<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakkımda</title>

    <style>
        body {
            background-color: #dcdcdc;
        }

        h2 {
            color: #2b70bb;
            padding-left: 20px;
            border-bottom: 2px solid #2b70bb;
            padding-bottom: 10px;
        }

        .kutu {
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
        }

        .kalin {
            font-weight: bold;
        }

        .italik {
            font-style: italic;
        }
    </style>
</head>

<body>

    <h2>Hakkımda</h2>

    <div class="kutu">
        <p>
            Merhaba! Ben Ayşe, Bilgisayar Programcılığı bölümünde okuyorum ve
            <span class="kalin">web tasarımı</span> öğreniyorum. Bu sayfayı HTML
            ve CSS dersinde öğrendiklerimi kullanarak hazırladım.
        </p>

        <p>
            Boş zamanlarımda kitap okumayı, fotoğraf çekmeyi ve
            <span class="italik">yeni şeyler öğrenmeyi seviyorum</span>.
        </p>
    </div>

</body>
</html>
